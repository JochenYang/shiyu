[package]
name = "shiyu"
version = "1.2.0"
description = "时语 Shiyu - 本地 AI 字幕生成与精修 (sherpa-onnx 多引擎 + 云端)"
authors = ["you"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5.0", features = [] }

[dependencies]
tauri = { version = "1.5.0", features = [ "dialog-open", "fs-write-file", "dialog-save", "protocol-asset", "shell-open", "fs-read-file", "icon-png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
