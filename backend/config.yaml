# Subtitle Assistant Configuration
# Model paths are resolved relative to model.dir
model:
  dir: "~/.shiyu/models"          # base dir for all model files
  onnx: "sensevoice-small/model.onnx"
  tokens: "sensevoice-small/tokens.json"
  model_config: "sensevoice-small/config.yaml"

# Audio preprocessing
audio:
  cmvn_file: "../models/sensevoice-small/am.mvn"
  sample_rate: 16000
  n_mels: 80
  frame_length: 25      # ms
  frame_shift: 10       # ms
  lfr_m: 7              # low frame rate factor
  lfr_n: 6
  max_duration: 300     # seconds, split if longer

# Inference settings
inference:
  language: "auto"      # auto, zh, en, ja, ko, yue
  use_itn: true         # inverse text normalization
  batch_size: 1
  device: "cpu"         # cpu or cuda

# Server settings
server:
  host: "127.0.0.1"
  port: 11235
  cors_origins: ["http://localhost:1420", "http://localhost:3000", "tauri://localhost"]

# Output defaults
output:
  default_format: "srt"   # srt, lrc, ass
  max_line_length: 40     # chars per subtitle line
  max_line_count: 2       # max lines per subtitle event
  # 字幕时间偏移 (秒) 由前端用户调, 走 API subtitle_offset_sec 参数
  # 不用 config.yaml, 避免每次调都要重启后端

# ASR engine registry (zipformer 主走)
# - zipformer: 主走, sherpa-onnx Zipformer-CTC-zh int8 (350MB), CTC 字符级对齐
# - paraformer: 备选, sherpa-onnx Paraformer-large int8 (232MB), CIF 显式 token 边界准
# - sensevoice: 多语言备选 (zh/en/ja/ko/yue 5 语言)
# - cloud: 云端 OpenAI 兼容 API (用户自己填 endpoint + key)
engines:
  paraformer:
    enabled: true   # 备选 — CIF 显式 token 边界准
    model_dir: "~/.shiyu/models/paraformer-large"
    num_threads: 4
  zipformer:
    enabled: true   # 主走 — CTC int8 字符级对齐
    model_dir: "~/.shiyu/models/zipformer-ctc-zh"
    num_threads: 4
    # CTC 峰值滞后补偿 (秒): CTC 发射 token 晚于实际发音约 100-200ms,
    # 字幕时间戳整体滞后. 0 = 关闭; 若发现字幕提前可调小 (如 0.10).
    ctc_delay_sec: 0.15
  sensevoice:
    enabled: true   # 多语言备选
    model_dir: "~/.shiyu/models/sensevoice-small"
    device: "cpu"
