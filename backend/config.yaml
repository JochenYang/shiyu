# Subtitle Assistant Configuration
# 模型由 backend/config/models.json 清单管理, 下载到 ~/.shiyu/models/<directory>/

# Model root (清单里的相对目录都挂在这里)
model:
  dir: "~/.shiyu/models"

# Audio preprocessing (sherpa-onnx 内部处理 fbank, 这里只保留重采样目标)
audio:
  sample_rate: 16000
  max_duration: 300     # seconds, split if longer

# Inference settings
inference:
  language: "auto"      # auto, zh, en, ja, ko, yue
  use_itn: true         # inverse text normalization
  device: "cpu"         # cpu or cuda

# Server settings
server:
  host: "127.0.0.1"
  port: 11235
  cors_origins: ["http://localhost:1420", "http://localhost:3000", "tauri://localhost"]

# Output defaults
output:
  default_format: "srt"   # srt, lrc, ass
  # 字幕时间偏移 (秒) 由前端用户调, 走 API subtitle_offset_sec 参数

# ASR engine registry — key 必须与 config/models.json 的 engine_name 一致
# 每个本地模型都走 sherpa-onnx, 只有线程数与 CTC 补偿可调。
# - zipformer_local: 主走, 中文 CTC, 逐 token 时间戳最细
# - sensevoice_local: 多语言备选 (zh/en/ja/ko/yue)
# - firered_local: 可选, 中文 + 英语 + 20 余种方言
# - qwen3_asr_local: 中英日韩粤, 无逐 token 时间戳, 需配合对齐器
engines:
  zipformer_local:
    enabled: true
    num_threads: 4
    # CTC 峰值滞后补偿 (秒): CTC 发射 token 晚于实际发音约 100-200ms,
    # 字幕时间戳整体滞后. 0 = 关闭; 若发现字幕提前可调小 (如 0.10).
    ctc_delay_sec: 0.15
  sensevoice_local:
    enabled: true
    num_threads: 4
    ctc_delay_sec: 0.15
  firered_local:
    enabled: true
    num_threads: 4
    ctc_delay_sec: 0.15
  qwen3_asr_local:
    enabled: true
    num_threads: 4
    ctc_delay_sec: 0.0
